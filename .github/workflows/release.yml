name: Build and Release FireStick APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x TvDashboard/gradlew

      - name: Build Release APK
        working-directory: TvDashboard
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p dist
          cp TvDashboard/app/build/outputs/apk/release/app-release.apk dist/ArchitainmentDashboards-FireStick.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ArchitainmentDashboards-FireStick.apk
          name: Architainment TV Dashboard ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
